services:
  t1:
    container_name: t1
    build:
      dockerfile: docker/t1.Dockerfile
    volumes:
      - ./out:/app/code/out/
      - ./out/dataset/fixed/:/app/code/in/test:ro
      - ./out/dataset/test/fixed_proto/:/app/code/Dataset/T1/test:ro
    working_dir: /app/code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu] 
    environment:
      CODEREADER_URL: http://codereader:8080
    # depends_on:
    #   codereader:
    #     condition: service_healthy
    profiles: ["t1", "arno", "test", "t1_eval"]
    networks:
      - codereader

  t2:
    container_name: t2
    build:
      dockerfile: docker/t2.Dockerfile
    volumes:
      - ./out:/app/code/out/
      - ./out/dataset/fixed/:/app/code/in/test:ro
    working_dir: /app/code
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    environment:
      CODEREADER_URL: http://codereader:8080
    depends_on:
      codereader:
        condition: service_healthy
    profiles: ["t2", "arno", "test", "t2_eval"]
    networks:
      - codereader

  t2_run:
    container_name: t2_run
    build:
      dockerfile: docker/t2_run.Dockerfile
    volumes:
      - ./out/temp/:/app/code/in:ro 
      - ./out/java/output/renamed_t2/:/app/code/out       
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles: ["t2_run"]

  t3:
    container_name: t3
    build:
      dockerfile: docker/t3.Dockerfile   
    volumes:
      - ./out:/app/out/
    env_file:
      - .env
    profiles: ["t3", "test", "full_local"]
    depends_on:
      api:
        condition: service_healthy
    networks:
      - pipeline

  t3_openai:
    container_name: t3_openai
    build:
      dockerfile: docker/t3.Dockerfile   
    volumes:
      - ./out:/app/out/
    env_file:
      - .env
    profiles: ["t3_openai"]
    networks:
      - pipeline

  t3_eval:
    container_name: t3_eval
    build:
      dockerfile: docker/t3_eval.Dockerfile
    volumes:
      - ./out:/app/out/
      - ./tools/java-dataset-converter-llm/dataset/test/jsonl/:/app/in/test:ro
    env_file:
      - .env
    profiles: ["t3_eval", "full_local_eval"]
    depends_on:
      api:
        condition: service_healthy
      codereader:
        condition: service_healthy
    environment:
      CODEREADER_URL: http://codereader:8080
      OLLAMA_HOST: http://codereader:11434
    networks:
      - pipeline
      - codereader

  t3_eval_openai:
    container_name: t3_eval_openai
    build:
      dockerfile: docker/t3_eval_oracle.Dockerfile
    volumes:
      - ./out:/app/out/
      - ./out/dataset/fixed/:/app/in/test:ro
    env_file:
      - .env
    profiles: ["t3_eval_openai"]
    depends_on:
      codereader:
        condition: service_healthy
    environment:
      CODEREADER_URL: http://codereader:8080
      OLLAMA_HOST: http://codereader:11434
    networks:
      - pipeline
      - codereader

  t3_eval_cohen:
    container_name: t3_eval_cohen
    build:
      dockerfile: docker/t3_eval_cohen.Dockerfile
    volumes:
      - ./out:/app/out/
      - ./tools/java-dataset-converter-llm/dataset/test/jsonl/:/app/in/test:ro
    env_file:
      - .env
    profiles: ["t3_eval_cohen"]
    depends_on:
      api:
        condition: service_healthy
      codereaded:
        condition: service_healthy
    environment:
      CODEREADER_URL: http://codereader:8080
      OLLAMA_HOST: http://codereader:11434
    networks:
      - pipeline
      - codereader

  t3_eval_oracle:
    container_name: t3_eval_oracle
    build:
      dockerfile: docker/t3_eval_oracle.Dockerfile
    volumes:
      - ./out:/app/out/
      - ./out/dataset/fixed/:/app/in/test:ro
    env_file:
      - .env
    profiles: ["t3_eval_oracle"]
    depends_on:
      api:
        condition: service_healthy
      codereader:
        condition: service_healthy
    environment:
      CODEREADER_URL: http://codereader:8080
      OLLAMA_HOST: http://codereader:11434
    networks:
      - pipeline
      - codereader

  benchmark:
    container_name: benchmark
    build:
      dockerfile: docker/benchmark.Dockerfile
    volumes:
      - ./out:/app/code/out/
    working_dir: /app/code
    depends_on:
      t1:
        condition: service_completed_successfully
      t2:
        condition: service_completed_successfully
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles: ["benchmark", "arno"]

  api:
    container_name: api
    build:
      dockerfile: docker/api.Dockerfile
    ports:
      - "8000:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    env_file:
      - .env
    environment:
      CUDA_LAUNCH_BLOCKING: "1"
      TORCH_USE_CUDA_DSA: "1"
    profiles: ["api", "full_local", "full_local_eval", "t3_eval_cohen", "t3_eval_oracle"]
    volumes:
      - hf_cache:/root/.cache/huggingface/
      - model_cache:/app/model/local_model/
      - ./out:/app/out/
    networks:
      - pipeline
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 1m

  tuner:
    container_name: tuner
    build:
      dockerfile: docker/tuner.Dockerfile
    volumes:
      - ./out:/app/out/
      - hf_cache:/root/.cache/huggingface/
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles: ["tune"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 16384
      stack: 67108864
      memlock:
        soft: -1
        hard: -1
    ipc: host

  tuner_preprocess:
    container_name: tuner_preprocess
    build:
      dockerfile: docker/tuner_preprocess.Dockerfile
    volumes:
      - ./out:/app/out/
      - hf_cache:/root/.cache/huggingface/
      - ./tools/java-dataset-converter-llm/dataset/train/jsonl/:/app/in/raw/train:ro
      - ./tools/java-dataset-converter-llm/dataset/val/jsonl/:/app/in/raw/val:ro
    working_dir: /app
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
    profiles: ["tune_process"]
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
      nproc: 16384
      stack: 67108864
      memlock:
        soft: -1
        hard: -1
    ipc: host

  codereader:
    container_name: codereader
    build:
      dockerfile: docker/codereader.Dockerfile
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              capabilities: [gpu]
              count: all
    profiles: ["full_local_eval", "t3_eval", "codereader", "t3_eval_cohen", "t3_eval_openai", "t1_eval", "t2_eval", "t3_eval_oracle"]
    networks:
      - codereader
    ports:
      - "11434:11434"
      - "8080:8080"
    volumes:
      - ollama_cache:/root/.ollama
      - ./out:/app/out/
    environment:
      CODEREADER_CONFIG_FILE: /app/codereader.yml
      OLLAMA_HOST: http://127.0.0.1:11434
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/health && curl -sf http://localhost:11434/api/tags | grep -q 'models'"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 15m

volumes:
  hf_cache:
  model_cache:
  ollama_cache:

networks:
  pipeline:
    driver: bridge
  codereader:
    driver: bridge
